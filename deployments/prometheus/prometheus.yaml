global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'auth_service'

    scrape_interval: 15s
    scrape_timeout: 10s

    static_configs:
      - targets:
          - 'auth-service:8081'

  - job_name: 'prometheus'

    scrape_interval: 15s

    static_configs:
      - targets:
          - 'localhost:9090'